services:
  llama-qwen36:
    image: havenoammo/llama:vulkan-server
    container_name: llama-qwen36
    restart: unless-stopped

    env_file:
      - .env

    # Vulkan / AMD GPU device passthrough
    devices:
      - /dev/dri:/dev/dri

    ports:
      - "8080:8080"

    volumes:
      - ./models:/models
      - ./hf-cache:/root/.cache/huggingface

    command:
      - --hf-repo
      - unsloth/Qwen3.6-27B-MTP-GGUF:UD-Q4_K_XL
      - --host
      - 0.0.0.0
      - --port
      - "8080"

      # GPU / Vulkan offload
      - --device
      - Vulkan0
      - --gpu-layers
      - auto
      - --fit
      - "on"
      - --fit-target
      - "1024"

      # Runtime config
      - --ctx-size
      - "131072"
      - --flash-attn
      - "on"
      - --cache-type-k
      - q8_0
      - --cache-type-v
      - q8_0

      # Server behavior
      - --parallel
      - "1"
      - --predict
      - "32768"

      # MTP speculative decoding
      - --mtp
      - "5"

      # Sampling defaults
      - --temp
      - "0.6"
      - --top-p
      - "0.95"
      - --top-k
      - "20"
      - --min-p
      - "0.0"
      - --presence-penalty
      - "0.0"
      - --repeat-penalty
      - "1.0"

      # Useful for terminal agents
      - --alias
      - qwen3.6-27b
      - --jinja
